services:
  api:
    build: ./backend
    env_file: .env
    volumes:
      - ./storage:/app/storage
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    build: ./frontend
    environment:
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
