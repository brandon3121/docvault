# Producción en red local: Caddy sirve HTTPS y es la única entrada.
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  caddy:
    image: caddy:2.11.7
    environment:
      DOCVAULT_HOST: ${DOCVAULT_HOST:?Define DOCVAULT_HOST en .env con la IP del servidor}
    ports:
      - "${DOCVAULT_HOST}:443:443"
      - "${DOCVAULT_HOST}:80:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

  api:
    restart: unless-stopped

  web:
    ports: !reset []
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
